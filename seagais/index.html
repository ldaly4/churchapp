<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102d29">
  <meta name="description" content="Welcome to Seagais.">
  <title>Seagais</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      background: #102d29;
      color: #f3f6eb;
    }

    body {
      box-sizing: border-box;
      min-height: 100svh;
      margin: 0;
      padding: clamp(1.5rem, 7vw, 7rem);
      display: grid;
      align-items: center;
      background: radial-gradient(ellipse at top right, #23584d, transparent 65%);
    }

    main {
      width: min(100%, 70rem);
      margin-inline: auto;
      padding-block: clamp(2rem, 8vw, 8rem);
      border-block: 1px solid #70938a;
    }

    h1 {
      margin: 0;
      font: 400 clamp(3.25rem, 15vw, 11rem) / 1 Georgia, serif;
      letter-spacing: -0.06em;
    }

    p {
      margin: 1.25rem 0 0;
      color: #cadbd2;
      font-size: 1.125rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main>
    <h1>Seagais</h1>
    <p>Welcome to Seagais.</p>
  </main>
</body>
</html>
