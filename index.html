<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neri | Catholic Parish Engagement Platform</title>
  <meta name="description" content="Neri helps Catholic parishes bring Mass times, prayer, events, giving, and community back into daily connection.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: "#fff8ee",
            parchment: "#f4e7d2",
            vellum: "#fbf1e2",
            ink: "#241713",
            wine: "#8e211a",
            oxblood: "#6f1715",
            gold: "#c9953e",
            green: "#183d32",
            stone: "#756a5f"
          },
          fontFamily: {
            serif: ["Cormorant Garamond", "serif"],
            sans: ["Manrope", "sans-serif"]
          },
          boxShadow: {
            soft: "0 22px 70px rgba(76, 38, 20, 0.13)",
            phone: "0 28px 80px rgba(50, 31, 20, 0.24)",
            card: "0 14px 42px rgba(76, 38, 20, 0.09)"
          },
          keyframes: {
            rise: {
              "0%": { opacity: "0", transform: "translateY(12px)" },
              "100%": { opacity: "1", transform: "translateY(0)" }
            },
            flame: {
              "0%, 100%": { transform: "translateX(-50%) scaleY(1) rotate(-1deg)", opacity: ".92" },
              "50%": { transform: "translateX(-50%) scaleY(1.12) rotate(2deg)", opacity: "1" }
            }
          },
          animation: {
            rise: "rise .45s ease-out",
            flame: "flame 2.3s ease-in-out infinite"
          }
        }
      }
    };
  </script>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: "Manrope", sans-serif;
      color: #241713;
      background:
        radial-gradient(circle at 22% -4%, rgba(201,149,62,.18), transparent 34rem),
        radial-gradient(circle at 88% 12%, rgba(142,33,26,.08), transparent 30rem),
        linear-gradient(180deg, #fff9f0 0%, #f9eedf 48%, #f6e6d2 100%);
    }
    .paper {
      background:
        linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,.18)),
        repeating-linear-gradient(90deg, rgba(82,55,34,.024) 0, rgba(82,55,34,.024) 1px, transparent 1px, transparent 46px),
        #fff8ee;
    }
    .arch-line {
      position: absolute;
      pointer-events: none;
      opacity: .42;
      border: 2px solid rgba(201,149,62,.36);
      border-bottom: 0;
      border-radius: 999px 999px 0 0;
    }
    .arch-line::before,
    .arch-line::after {
      content: "";
      position: absolute;
      inset: 14px;
      border: 1px solid rgba(201,149,62,.3);
      border-bottom: 0;
      border-radius: 999px 999px 0 0;
    }
    .arch-line::after {
      inset: 28px;
      border-style: dashed;
      opacity: .7;
    }
    .soft-card {
      border: 1px solid rgba(128, 85, 45, .14);
      background: rgba(255, 251, 244, .72);
      box-shadow: 0 14px 42px rgba(76, 38, 20, .08);
      backdrop-filter: blur(14px);
    }
    .phone-shell {
      border: 8px solid #161411;
      border-radius: 42px;
      background: #161411;
      box-shadow: 0 28px 80px rgba(50,31,20,.24);
    }
    .phone-face {
      border-radius: 32px;
      background:
        radial-gradient(circle at 90% 2%, rgba(201,149,62,.13), transparent 9rem),
        #fffaf1;
      overflow: hidden;
    }
    .notch {
      position: absolute;
      left: 50%;
      top: 10px;
      width: 96px;
      height: 26px;
      transform: translateX(-50%);
      border-radius: 999px;
      background: #12110f;
      z-index: 5;
    }
    .screen-scroll::-webkit-scrollbar { width: 0; height: 0; }
    .screen-scroll { scrollbar-width: none; -ms-overflow-style: none; }
    .wine-band {
      background:
        radial-gradient(circle at 85% 30%, rgba(255,226,164,.16), transparent 22rem),
        linear-gradient(135deg, #8e211a 0%, #701713 68%, #5b100f 100%);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">
    const { useState } = React;

    const phoneTabs = [
      ["home", "Home"],
      ["prayer", "Prayer"],
      ["events", "Events"],
      ["giving", "Giving"],
      ["profile", "Profile"]
    ];

    const challengeCards = [
      ["Younger generations are drifting from parish life", "people"],
      ["Families abroad want to stay connected to their home parish", "home"],
      ["Parish staff are overwhelmed with admin and coordination", "clock"],
      ["Communication is fragmented across multiple platforms", "message"]
    ];

    const possibilityCards = [
      ["Stay Connected", "Mass times, events, bulletins, prayer requests, updates, and notices in one place.", "people"],
      ["Deepen Parish Life", "Daily readings, homilies, reflections, Mass intentions, and spiritual tools to grow in faith.", "book"],
      ["Support Your Parish", "Digital giving, sacrament requests, volunteer coordination, and community groups.", "heart"]
    ];

    const features = [
      ["Parishioner engagement", "A beautiful parish app that feels local, devotional, and easy for every generation."],
      ["Digital giving", "One-time and recurring support, CHY3 guidance, campaigns, and donation summaries."],
      ["Mass cards and candles", "Digital and physical Mass cards, memorial links, and prayerful candle lighting."],
      ["Daily prayer", "Readings, Gospel reflections, priest voice notes, and seasonal parish prayer content."],
      ["Events and volunteering", "Coffee mornings, youth nights, pilgrimages, choir practice, and volunteer calls."],
      ["Sacraments and intentions", "Structured enquiries for baptism, weddings, funeral support, certificates, and Mass intentions."],
      ["Bulletins and homilies", "Weekly bulletin PDFs, parish notices, livestream links, and Sunday homily archives."],
      ["Diaspora connection", "A way for families abroad to stay close to the parish that still feels like home."]
    ];

    const adminTools = [
      "Manage events and parish notices",
      "Respond to prayer requests",
      "Share updates and bulletins",
      "Review giving summaries",
      "Confirm Mass intentions",
      "Reduce admin and save time"
    ];

    function App() {
      const [activePhone, setActivePhone] = useState("home");
      const [toast, setToast] = useState("");

      const showToast = (message) => {
        setToast(message);
        clearTimeout(window.__neriToast);
        window.__neriToast = setTimeout(() => setToast(""), 2600);
      };

      return (
        <main className="paper min-h-screen overflow-hidden">
          <Hero activePhone={activePhone} setActivePhone={setActivePhone} showToast={showToast} />
          <Challenge />
          <Possibilities />
          <AppShowcase setActivePhone={setActivePhone} />
          <ParishFit />
          <AdminBand showToast={showToast} />
          <Features />
          <SaintNeri />
          <FinalCTA />
          {toast && (
            <div className="fixed bottom-6 left-1/2 z-50 max-w-[90vw] -translate-x-1/2 rounded-full bg-green px-5 py-3 text-sm font-bold text-cream shadow-soft">
              {toast}
            </div>
          )}
        </main>
      );
    }

    function Icon({ type }) {
      const common = "mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-full border border-wine/18 text-wine";
      const glyphs = {
        people: "○○○",
        home: "⌂",
        clock: "◷",
        message: "▱",
        book: "▤",
        heart: "♡",
        candle: "♢",
        cross: "✚"
      };
      return <div className={common}>{glyphs[type] || "✦"}</div>;
    }

    function Logo() {
      return (
        <div className="text-center">
          <div className="relative mx-auto mb-3 h-24 w-28">
            <div className="arch-line left-1/2 top-0 h-24 w-24 -translate-x-1/2"></div>
          </div>
          <div className="font-serif text-6xl font-semibold uppercase tracking-[0.22em] text-wine md:text-7xl">Neri</div>
          <p className="mt-3 text-xs font-extrabold uppercase tracking-[0.48em] text-wine">Bringing parish life</p>
          <p className="mt-1 text-xs font-extrabold uppercase tracking-[0.42em] text-wine">back into daily connection</p>
        </div>
      );
    }

    function Hero({ activePhone, setActivePhone, showToast }) {
      return (
        <section className="relative mx-auto min-h-screen max-w-7xl px-5 pb-10 pt-8 lg:px-8">
          <div className="arch-line right-[-80px] top-36 hidden h-[700px] w-[430px] lg:block"></div>
          <div className="grid gap-10 lg:grid-cols-[1fr_460px]">
            <div className="flex flex-col justify-center pt-8 lg:min-h-[760px]">
              <Logo />
              <div className="mt-20 max-w-2xl">
                <h1 className="font-serif text-6xl font-semibold leading-[.94] text-ink md:text-7xl">
                  Parish life shouldn’t begin and end on <span className="italic text-wine">Sunday morning.</span>
                </h1>
                <p className="mt-7 max-w-lg text-lg leading-8 text-[#3b2f29]">
                  Neri helps Catholic parishes stay connected through prayer, events, communication, giving, and community, all in one beautiful, easy-to-use app.
                </p>
                <div className="mt-8 flex flex-wrap gap-3">
                  <a href="#app-preview" className="rounded-full bg-wine px-6 py-3 text-sm font-bold text-cream shadow-card">
                    Try the parishioner app
                  </a>
                  <a href="#admin" className="rounded-full border border-wine/20 bg-white/60 px-6 py-3 text-sm font-bold text-wine">
                    View priest and admin tools
                  </a>
                </div>
              </div>
            </div>
            <div className="relative flex items-center justify-center lg:pt-44">
              <Phone active={activePhone} setActive={setActivePhone} showToast={showToast} tilt />
            </div>
          </div>
        </section>
      );
    }

    function Challenge() {
      return (
        <section className="mx-auto max-w-7xl px-5 py-8 lg:px-8">
          <p className="text-center text-xs font-extrabold uppercase tracking-[0.5em] text-wine">The challenge for parishes</p>
          <div className="mt-8 grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
            {challengeCards.map(([text, icon]) => (
              <div key={text} className="soft-card rounded-[24px] p-6 text-center">
                <Icon type={icon} />
                <p className="text-sm font-semibold leading-6 text-ink">{text}</p>
              </div>
            ))}
          </div>
        </section>
      );
    }

    function Possibilities() {
      return (
        <section className="mx-auto max-w-7xl px-5 py-12 lg:px-8">
          <p className="text-center text-xs font-extrabold uppercase tracking-[0.5em] text-wine">What Neri makes possible</p>
          <div className="mt-8 grid gap-6 md:grid-cols-3">
            {possibilityCards.map(([title, body, icon]) => (
              <div key={title} className="soft-card rounded-[28px] p-8 text-center">
                <Icon type={icon} />
                <h2 className="text-xl font-extrabold text-ink">{title}</h2>
                <p className="mt-3 text-sm leading-7 text-stone">{body}</p>
              </div>
            ))}
          </div>
        </section>
      );
    }

    function AppShowcase({ setActivePhone }) {
      return (
        <section id="app-preview" className="mx-auto grid max-w-7xl gap-10 px-5 py-14 lg:grid-cols-[1.1fr_.9fr] lg:px-8">
          <div className="flex items-end justify-center gap-3 md:gap-5">
            <MiniPhone screen="events" setActivePhone={setActivePhone} />
            <MiniPhone screen="prayer" setActivePhone={setActivePhone} large />
            <MiniPhone screen="giving" setActivePhone={setActivePhone} />
          </div>
          <div className="flex flex-col justify-center">
            <div className="border-l-2 border-gold pl-8">
              <h2 className="max-w-md font-serif text-5xl font-semibold leading-none text-ink">
                Designed for Your Parish
              </h2>
            </div>
            <div className="mt-8 space-y-6">
              {[
                ["Fully personalised with your parish name, colours and imagery", "cross"],
                ["Simple tools for priests, secretaries, and parish staff", "people"],
                ["Secure, reliable, and built with Catholic values at the core", "candle"]
              ].map(([text, icon]) => (
                <div key={text} className="flex items-center gap-5">
                  <div className="flex h-14 w-14 shrink-0 items-center justify-center rounded-full bg-parchment text-wine shadow-card">
                    <span>{icon === "cross" ? "✚" : icon === "people" ? "○○" : "♢"}</span>
                  </div>
                  <p className="max-w-sm text-base leading-7 text-ink">{text}</p>
                </div>
              ))}
            </div>
          </div>
        </section>
      );
    }

    function ParishFit() {
      return (
        <section className="mx-auto max-w-7xl px-5 pb-16 lg:px-8">
          <div className="grid gap-6 md:grid-cols-4">
            {["White-label parish identity", "Daily community contact", "Diaspora family support", "Simple giving and requests"].map((item) => (
              <div key={item} className="rounded-[24px] border border-wine/10 bg-white/46 p-5 text-center shadow-card">
                <p className="font-serif text-2xl leading-none text-wine">{item}</p>
              </div>
            ))}
          </div>
        </section>
      );
    }

    function AdminBand({ showToast }) {
      return (
        <section id="admin" className="wine-band relative overflow-hidden py-16 text-cream">
          <div className="arch-line bottom-0 right-10 hidden h-[360px] w-[240px] border-cream/20 lg:block"></div>
          <div className="mx-auto grid max-w-7xl gap-10 px-5 lg:grid-cols-[1fr_1fr] lg:px-8">
            <div className="flex items-center justify-center">
              <AdminLaptop showToast={showToast} />
            </div>
            <div className="flex flex-col justify-center">
              <h2 className="max-w-lg font-serif text-5xl font-semibold leading-none">
                Simple, powerful tools for parish teams
              </h2>
              <div className="mt-8 space-y-4">
                {adminTools.map((tool) => (
                  <button key={tool} onClick={() => showToast(`${tool} preview selected.`)} className="flex items-center gap-3 text-left text-lg font-semibold text-cream/92">
                    <span className="flex h-6 w-6 items-center justify-center rounded-full border border-gold text-sm text-gold">✓</span>
                    {tool}
                  </button>
                ))}
              </div>
            </div>
          </div>
        </section>
      );
    }

    function Features() {
      return (
        <section className="mx-auto max-w-7xl px-5 py-16 lg:px-8">
          <div className="mx-auto max-w-3xl text-center">
            <p className="text-xs font-extrabold uppercase tracking-[0.46em] text-wine">A parish platform, not a social feed</p>
            <h2 className="mt-4 font-serif text-5xl font-semibold leading-none text-ink">
              Built around the real rhythm of Catholic parish life.
            </h2>
          </div>
          <div className="mt-10 grid gap-4 md:grid-cols-2 lg:grid-cols-4">
            {features.map(([title, body]) => (
              <div key={title} className="soft-card rounded-[24px] p-6">
                <h3 className="font-serif text-3xl leading-none text-wine">{title}</h3>
                <p className="mt-3 text-sm leading-7 text-stone">{body}</p>
              </div>
            ))}
          </div>
        </section>
      );
    }

    function SaintNeri() {
      return (
        <section className="mx-auto grid max-w-7xl gap-10 px-5 py-16 lg:grid-cols-[.85fr_1.15fr] lg:px-8">
          <div className="soft-card rounded-[32px] p-8">
            <div className="mb-5 flex h-24 w-24 items-center justify-center rounded-full bg-parchment font-serif text-5xl text-wine">N</div>
            <p className="text-lg leading-8 text-ink">
              Inspired by <strong>Saint Philip Neri</strong>, who dedicated his life to building joyful, welcoming communities rooted in faith.
            </p>
          </div>
          <div className="flex items-center border-l-2 border-gold pl-10">
            <div>
              <h2 className="max-w-2xl font-serif text-5xl font-semibold leading-none text-ink">
                We are currently inviting parishes to trial Neri and help shape the future of parish life in Ireland.
              </h2>
              <a href="mailto:hello@neri.ie?subject=Neri parish trial" className="mt-8 inline-flex rounded-full bg-wine px-12 py-4 text-base font-extrabold text-cream shadow-card">
                Register Interest
              </a>
            </div>
          </div>
        </section>
      );
    }

    function FinalCTA() {
      return (
        <footer className="border-t border-wine/10 px-5 py-8 text-center text-sm text-stone">
          <p>Neri is a frontend prototype for parish feedback. Full demo link coming next.</p>
        </footer>
      );
    }

    function Phone({ active, setActive, showToast, tilt = false }) {
      return (
        <div className={tilt ? "origin-bottom rotate-[5deg] transition hover:rotate-[2deg]" : ""}>
          <div className="phone-shell relative w-[320px] max-w-full">
            <div className="notch"></div>
            <div className="phone-face min-h-[610px] px-4 pb-4 pt-12">
              <div className="screen-scroll h-[535px] overflow-y-auto pb-20">
                <PhoneScreen active={active} showToast={showToast} />
              </div>
              <div className="absolute bottom-3 left-3 right-3 rounded-[24px] border border-wine/10 bg-cream/92 px-2 py-2 shadow-card backdrop-blur">
                <div className="grid grid-cols-5 gap-1">
                  {phoneTabs.map(([id, label]) => (
                    <button key={id} onClick={() => setActive(id)} className={`rounded-2xl px-1 py-2 text-[10px] font-bold ${active === id ? "bg-parchment text-wine" : "text-stone"}`}>
                      <span className="block text-base">{id === "home" ? "⌂" : id === "prayer" ? "✦" : id === "events" ? "□" : id === "giving" ? "♡" : "○"}</span>
                      {label}
                    </button>
                  ))}
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function PhoneScreen({ active, showToast }) {
      if (active === "prayer") return <PrayerScreen showToast={showToast} />;
      if (active === "events") return <EventsScreen />;
      if (active === "giving") return <GivingScreen showToast={showToast} />;
      if (active === "profile") return <ProfileScreen showToast={showToast} />;
      return <HomeScreen showToast={showToast} />;
    }

    function HomeScreen({ showToast }) {
      return (
        <div className="animate-rise space-y-4">
          <div className="flex items-center justify-between">
            <div>
              <p className="font-serif text-xl text-ink">St. Brigid’s Parish</p>
              <p className="text-xs text-stone">Kildare</p>
            </div>
            <span className="text-wine">✚</span>
          </div>
          <div>
            <p className="text-xs text-stone">Good morning</p>
            <h3 className="font-serif text-3xl leading-none text-ink">Peace be with you.</h3>
          </div>
          <div className="rounded-[22px] bg-parchment p-3 shadow-card">
            <div className="grid grid-cols-[1fr_120px] gap-3">
              <div>
                <p className="text-xs text-stone">Today’s Mass</p>
                <p className="font-serif text-2xl text-ink">10:00am</p>
                <p className="text-xs text-stone">Tuesday, 21 May</p>
              </div>
              <div className="relative overflow-hidden rounded-2xl bg-[#b77b42]">
                <div className="absolute left-1/2 top-8 h-12 w-5 -translate-x-1/2 rounded-full bg-gradient-to-b from-white via-yellow-200 to-orange-500"></div>
                <div className="absolute bottom-4 left-1/2 h-20 w-14 -translate-x-1/2 rounded-t-2xl bg-gradient-to-b from-[#f4deb0] to-[#8e4f22]"></div>
              </div>
            </div>
          </div>
          <div className="grid grid-cols-3 gap-3">
            {["Daily Prayer", "Events", "Mass Times", "Light a Candle", "Prayer Requests", "Giving"].map((item) => (
              <button key={item} onClick={() => showToast(`${item} opens in the full demo.`)} className="rounded-[18px] bg-white p-3 text-center text-[11px] font-bold text-ink shadow-card">
                <span className="mb-2 block text-wine">{item.includes("Prayer") ? "✦" : item.includes("Giving") ? "♡" : item.includes("Candle") ? "♢" : "□"}</span>
                {item}
              </button>
            ))}
          </div>
        </div>
      );
    }

    function PrayerScreen({ showToast }) {
      const [lit, setLit] = useState(false);
      return (
        <div className="animate-rise space-y-4">
          <button className="text-sm text-stone">‹ Back</button>
          <h3 className="font-serif text-3xl leading-none text-ink">Daily Prayer</h3>
          <div className="rounded-[22px] bg-parchment p-4 shadow-card">
            <p className="text-xs uppercase tracking-[0.18em] text-wine">Reading of the day</p>
            <p className="mt-2 font-serif text-2xl text-ink">John 15:9-17</p>
            <p className="mt-3 text-sm leading-6 text-stone">“Remain in my love.”</p>
          </div>
          <button onClick={() => { setLit(true); showToast("A candle has been lit in prayer."); }} className="relative h-40 w-full overflow-hidden rounded-[22px] bg-[#3a2219] text-cream shadow-card">
            {lit && <span className="animate-flame absolute left-1/2 top-8 h-16 w-7 rounded-full bg-gradient-to-b from-white via-yellow-200 to-orange-500"></span>}
            <span className="absolute bottom-6 left-1/2 -translate-x-1/2 rounded-full bg-wine px-5 py-2 text-sm font-bold">Light a Candle</span>
          </button>
          <div className="rounded-[22px] bg-white p-4 shadow-card">
            <p className="font-bold text-ink">Prayer Requests</p>
            <p className="mt-2 text-sm leading-6 text-stone">For families waiting on hospital news, and for all who feel far from home.</p>
          </div>
        </div>
      );
    }

    function EventsScreen() {
      return (
        <div className="animate-rise space-y-4">
          <h3 className="font-serif text-3xl text-ink">Events</h3>
          {[
            ["Youth Group", "Fri 24 May, 7:30pm", "Parish Centre"],
            ["Bible Study", "Wed 29 May, 7:00pm", "Online"],
            ["Corpus Christi Procession", "Sun 2 June, 12:30pm", "Church grounds"]
          ].map(([title, date, place]) => (
            <div key={title} className="rounded-[22px] bg-white p-3 shadow-card">
              <p className="font-bold text-ink">{title}</p>
              <p className="text-xs text-wine">{date}</p>
              <p className="mt-1 text-xs text-stone">{place}</p>
            </div>
          ))}
        </div>
      );
    }

    function GivingScreen({ showToast }) {
      return (
        <div className="animate-rise space-y-4">
          <h3 className="font-serif text-3xl text-ink">Give</h3>
          <div className="grid grid-cols-2 rounded-full bg-parchment p-1">
            <button className="rounded-full bg-ink px-3 py-2 text-xs font-bold text-cream">One-time</button>
            <button className="rounded-full px-3 py-2 text-xs font-bold text-stone">Recurring</button>
          </div>
          <div className="grid grid-cols-2 gap-3">
            {["€10", "€20", "€50", "Other"].map((amount) => (
              <button key={amount} className="rounded-[18px] bg-white p-4 text-sm font-bold text-ink shadow-card">{amount}</button>
            ))}
          </div>
          <button onClick={() => showToast("Donation flow opens in the full demo.")} className="w-full rounded-full bg-ink px-4 py-3 text-sm font-bold text-cream">Donate</button>
          <p className="text-center text-xs text-stone">Your support makes a difference.</p>
        </div>
      );
    }

    function ProfileScreen({ showToast }) {
      return (
        <div className="animate-rise space-y-4">
          <h3 className="font-serif text-3xl text-ink">Parish Services</h3>
          {["Sacrament enquiries", "Mass intentions", "Mass cards", "Bulletin", "Homilies", "Contact parish office"].map((item) => (
            <button key={item} onClick={() => showToast(`${item} preview opens in the full demo.`)} className="flex w-full items-center justify-between rounded-[20px] bg-white p-4 text-left text-sm font-bold text-ink shadow-card">
              {item}<span className="text-wine">›</span>
            </button>
          ))}
        </div>
      );
    }

    function MiniPhone({ screen, setActivePhone, large = false }) {
      const height = large ? "h-[430px]" : "h-[360px]";
      const width = large ? "w-[210px]" : "w-[175px]";
      return (
        <button onClick={() => setActivePhone(screen)} className={`phone-shell ${width} ${large ? "" : "mb-6 rotate-[-4deg]"} p-1 text-left transition hover:-translate-y-1`}>
          <div className={`phone-face ${height} p-3`}>
            <div className="mx-auto mb-4 h-3 w-12 rounded-full bg-ink"></div>
            <p className="font-serif text-xl text-ink">{screen === "events" ? "Events" : screen === "prayer" ? "Daily Prayer" : "Give"}</p>
            <div className="mt-4 space-y-3">
              {[1,2,3].map((item) => (
                <div key={item} className="rounded-2xl bg-parchment p-3 shadow-card">
                  <div className="mb-2 h-14 rounded-xl bg-gradient-to-br from-gold/50 to-wine/20"></div>
                  <div className="h-2 w-2/3 rounded-full bg-ink/20"></div>
                  <div className="mt-2 h-2 w-1/2 rounded-full bg-ink/10"></div>
                </div>
              ))}
            </div>
          </div>
        </button>
      );
    }

    function AdminLaptop({ showToast }) {
      return (
        <div className="w-full max-w-[520px]">
          <div className="rounded-t-[22px] border border-cream/25 bg-[#211513] p-3 shadow-soft">
            <div className="rounded-[14px] bg-cream p-5 text-ink">
              <div className="mb-5 flex items-center justify-between">
                <div>
                  <p className="font-serif text-2xl text-wine">Neri</p>
                  <p className="text-xs text-stone">St. Brigid’s Parish admin</p>
                </div>
                <button onClick={() => showToast("Public app preview opened.")} className="rounded-full bg-parchment px-3 py-2 text-xs font-bold text-wine">Preview app</button>
              </div>
              <div className="grid grid-cols-4 gap-3">
                {["Donations", "Intentions", "Volunteers", "Bulletins", "Events", "Candles", "Notices", "Homilies"].map((item) => (
                  <button key={item} onClick={() => showToast(`${item} opened.`)} className="rounded-2xl bg-parchment p-3 text-center text-[11px] font-bold text-ink">
                    <span className="mb-2 block text-wine">□</span>{item}
                  </button>
                ))}
              </div>
            </div>
          </div>
          <div className="mx-auto h-4 w-[108%] -translate-x-[4%] rounded-b-[24px] bg-[#cdbca6] shadow-soft"></div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
